<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Задачи</title>
</head>
<body>
<h1>Список задач</h1>

<p>
    <a th:href="@{/}">Главная</a> |
    <a th:href="@{/task/new}">Добавить задачу</a>
</p>

<p>
    Показать:
    <a th:href="@{/tasks}">Все</a> |
    <a th:href="@{/tasks/filter(completed=true)}">Выполненные</a> |
    <a th:href="@{/tasks/filter(completed=false)}">Невыполненные</a>
</p>

<p th:if="${#lists.isEmpty(tasks)}">Задач нет.</p>

<div th:each="task : ${tasks}">
    <h2 th:text="${task.name}">Название</h2>
    <p th:text="${task.description}">Описание</p>

    <p>
        Срок:
        <span th:text="${task.dueDate}">Дата</span>
    </p>

    <p th:text="${task.completed ? 'Выполнена' : 'Не выполнена'}">
        Статус
    </p>

    <p>
        <a th:href="@{/task/edit/{id}(id=${task.id})}">
            Редактировать
        </a>
    </p>

    <form th:action="@{/task/delete/{id}(id=${task.id})}"
          method="post">
        <button type="submit">Удалить</button>
    </form>

    <hr>
</div>
</body>
</html>
