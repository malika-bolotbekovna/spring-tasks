<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Мои задачи</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="container">
    <header class="header">
        <div>
            <a th:href="@{/}" class="muted">← Главная</a>
            <h1>Мои задачи</h1>
            <span class="muted">Планируйте дела и отслеживайте выполнение</span>
        </div>

        <a class="button" th:href="@{/task/new}">+ Новая задача</a>
    </header>

    <section class="panel" aria-label="Фильтры">
        <form class="filters"
              th:action="@{/tasks/filter}"
              method="get">

            <div class="field">
                <label for="completed">Статус</label>
                <select id="completed" name="completed">
                    <option value=""
                            th:selected="${completed == null}">
                        Все задачи
                    </option>
                    <option value="false"
                            th:selected="${completed != null and completed == false}">
                        Невыполненные
                    </option>
                    <option value="true"
                            th:selected="${completed != null and completed == true}">
                        Выполненные
                    </option>
                </select>
            </div>

            <div class="field">
                <label for="startDate">Срок с</label>
                <input id="startDate"
                       name="startDate"
                       type="date"
                       th:value="${startDate}">
            </div>

            <div class="field">
                <label for="endDate">По</label>
                <input id="endDate"
                       name="endDate"
                       type="date"
                       th:value="${endDate}">
            </div>

            <button type="submit">Применить</button>
            <a class="button secondary" th:href="@{/tasks}">Сбросить</a>
        </form>

        <p class="error"
           th:if="${filterError != null}"
           th:text="${filterError}"></p>
    </section>

    <p class="muted"
       th:if="${filterError == null}"
       th:text="|Найдено задач: ${#lists.size(tasks)}|"></p>

    <div class="panel empty"
         th:if="${#lists.isEmpty(tasks) and filterError == null}">
        <h2>Задач не найдено</h2>
        <p class="muted">Измените фильтры или создайте новую задачу.</p>
    </div>

    <section class="grid">
        <article class="card" th:each="task : ${tasks}">
            <span class="badge"
                  th:classappend="${task.completed ? 'done' : 'pending'}"
                  th:text="${task.completed ? 'Выполнена' : 'В работе'}">
            </span>

            <h2 th:text="${task.name}">Название</h2>

            <p class="description"
               th:text="${task.description}">Описание</p>

            <div class="muted">
                Срок:
                <span th:text="${task.dueDate != null
                    ? #temporals.format(task.dueDate, 'dd.MM.yyyy')
                    : 'не указан'}"></span>
            </div>

            <div class="actions">
                <a class="button secondary"
                   th:href="@{/task/edit/{id}(id=${task.id})}">
                    Изменить
                </a>

                <form th:action="@{/task/delete/{id}(id=${task.id})}"
                      method="post">
                    <button class="danger" type="submit">Удалить</button>
                </form>
            </div>
        </article>
    </section>
</main>
</body>
</html>
