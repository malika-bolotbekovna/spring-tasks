<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Форма задачи</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="container">
    <div class="panel task-form">
        <h1 th:text="${taskModel.id == null
            ? 'Новая задача' : 'Редактирование задачи'}"></h1>

        <p class="muted">Укажите название, описание и срок выполнения.</p>

        <form th:action="@{/task/save}"
              th:object="${taskModel}"
              method="post">

            <input type="hidden" th:field="*{id}">

            <div class="field">
                <label for="name">Название</label>
                <input id="name" type="text" th:field="*{name}"
                       placeholder="Что нужно сделать?">

                <span class="error"
                      th:if="${#fields.hasErrors('name')}"
                      th:errors="*{name}"></span>
            </div>

            <div class="field">
                <label for="description">Описание</label>
                <textarea id="description"
                          th:field="*{description}"
                          placeholder="Подробности задачи"></textarea>
            </div>

            <div class="field">
                <label for="dueDate">Срок выполнения</label>
                <input id="dueDate" type="date" th:field="*{dueDate}">

                <span class="error"
                      th:if="${#fields.hasErrors('dueDate')}"
                      th:errors="*{dueDate}"></span>
            </div>

            <p>
                <label>
                    <input type="checkbox" th:field="*{completed}">
                    Задача выполнена
                </label>
            </p>

            <div class="actions">
                <button type="submit">Сохранить</button>
                <a class="button secondary" th:href="@{/tasks}">Отмена</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
